[package]
name = "shuttle-rs"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "Rust port of Shuttle macOS menu-bar app"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
glob = "0.3"
yaml_serde = "0.10.4"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = "allow"
