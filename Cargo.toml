[package]
name = "shuttle-rs"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust port of Shuttle macOS menu-bar app"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = "allow"
